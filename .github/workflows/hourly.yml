name: hourly

on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  spec:
    if: github.repository == 'nodemode-dev/formadaptor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nodemode-dev/formcompiler
          ref: main
          path: compiler
          persist-credentials: false
      - name: The published spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/spec.py fetch --out "$RUNNER_TEMP/published.json"
      - name: Build the family spec
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/spec.py build --compiler compiler --out "$RUNNER_TEMP/family.json" --previous "$RUNNER_TEMP/published.json"
      - name: Main against the released tags (advisory)
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/advisory.py --family "$RUNNER_TEMP/family.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.build.outputs.changed == 'true'
        with:
          name: family
          path: ${{ runner.temp }}/family.json
          retention-days: 7

  publish:
    needs: spec
    if: github.repository == 'nodemode-dev/formadaptor' && github.ref == 'refs/heads/main' && needs.spec.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: family
          path: ${{ runner.temp }}/spec
      - name: Publish family.json on the spec branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/spec.py publish --file "$RUNNER_TEMP/spec/family.json"
